# Goal: To check if python code is syntatically correct and to run tests
name: code lint

on: 
  #push:
  workflow_dispatch:

jobs:
  code-linter-tester:
    runs-on: ubuntu-latest
    strategy:
       matrix:
        python-version: [3.11, 3.12, 3.14]
    steps:
      - name: checkout code
        uses: actions/checkout@v7

      - name: set up python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: install dependencies
        run: pip install -r requirements.txt

      #- name: install ruff
       # run: pip install ruff

      - name: run ruff
        run: ruff check .

      - name: run tests
        run: pytest


         

    
        