# Goal: To check if python code is syntatically correct
name: code lint

on: 
  push:
  workflow_dispatch:

jobs:
  code-linter:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v7

      - name: set up python
        uses: actions/setup-python@v7
        with:
          python-version: 3.11

      - name: install dependencies
        run: pip install -r requirements.txt

      - name: code lint
        run: ruff check .

         

    
        