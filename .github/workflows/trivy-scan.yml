# Goal : to scan the built dockeer image before pushing to docker hub 
name: Trivy-Scan
on: 
    workflow_call:
jobs:
    trivy-scan:
        runs-on: ubuntu-latest
        steps:
            - name: code checkout
              uses: actions/checkout@v7

             # Step 2: Set up Docker Buildx
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

             #step3: log in to docker hub
            - name: log in to Docker Hub
              uses: docker/login-action@v3
              with:
                username: ${{ secrets.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_PASSWORD }}

             # Step 4: Build the Docker image
            - name: Build Docker image
              uses: docker/build-push-action@v7
              with:
                push: false
                tags: ${{ secrets.DOCKERHUB_USERNAME }}/e-commerce-python:latest 

              # Step 5: trivy scan the docker image
            - name: Trivy Scan  
              uses: aquasecurity/trivy-action@v0.36.0
              with:
                image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/e-commerce-python:latest
                format: 'table'
                exit-code: '1'
                ignore-unfixed: true
                severity: 'CRITICAL'